<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纹明 · 中国图案数字资源平台</title>
<meta name="description" content="纹明——中国图案数字资源平台。收录 230 组博物馆纹样描摹线图，按时代、地域、类别、载体、工艺五个维度检索；含鸡缸杯五朝鸡纹主视觉。">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
--paper:#F6F2E8; --paper2:#FBF8F0; --card:#FFFDF8;
--ink:#1B1E1B; --ink2:#4C524B; --ink3:#8C9188;
--line:#DAD2C2; --line2:#E9E3D5;
--red:#9E3B2C; --jade:#5B6E61;
--serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
--maxw:1300px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.055;mix-blend-mode:multiply;
background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}
img{max-width:100%}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(246,242,232,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:0 40px;height:78px;display:flex;align-items:center;gap:40px}
.brand{display:flex;align-items:baseline;gap:14px;cursor:pointer}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.26em;color:var(--ink)}
.brand small{font-size:9px;letter-spacing:.32em;color:var(--ink3);text-transform:uppercase}
.nav-links{display:flex;gap:30px;margin-left:auto;font-size:13.5px;letter-spacing:.08em}
.nav-links a{padding:4px 0;color:var(--ink2);position:relative;transition:color .3s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.on{color:var(--ink)}
.nav-links a.on::after{content:"";position:absolute;left:0;right:2px;bottom:-3px;height:1px;background:var(--red)}
.search{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:5px 0;width:172px}
.search svg{width:13px;height:13px;flex:none;opacity:.55}
.search input{border:0;background:none;outline:none;width:100%;font-size:12.5px;letter-spacing:.04em}
.search input::placeholder{color:var(--ink3)}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px;position:relative;z-index:2}
.sec{padding-top:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:32px}
.sec-head .l{display:flex;align-items:baseline;gap:16px}
.sec-head h3{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:.12em}
.sec-head .en{font-size:9px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase}
.sec-head .more{font-size:12.5px;color:var(--ink3);letter-spacing:.1em;white-space:nowrap;transition:.3s}
.sec-head .more:hover{color:var(--red)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.06fr .94fr;gap:72px;align-items:center;padding:92px 0 84px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.24em;color:var(--ink3)}
.eyebrow::before{content:"";width:38px;height:1px;background:var(--ink3)}
.hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.3vw,60px);line-height:1.28;letter-spacing:.05em;margin-top:26px}
.hero h2 em{font-style:normal;color:var(--ink);position:relative}
.hero h2 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:6%;height:36%;background:var(--red);opacity:.07;z-index:-1}
.lede{max-width:31em;margin-top:30px;color:var(--ink2);font-size:14.5px;font-weight:300;line-height:2.05}
.hero-act{display:flex;gap:14px;margin-top:40px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border:1px solid var(--ink);background:none;cursor:pointer;font-size:13px;letter-spacing:.12em;transition:.35s}
.btn.solid{background:var(--ink);color:var(--paper2)}
.btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:9px 18px;font-size:12px}
.hero-stats{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;letter-spacing:.14em;color:var(--ink3);display:flex;flex-wrap:wrap;gap:10px 22px}

.hero-art{position:relative;background:var(--card);border:1px solid var(--line);padding:24px}
.hero-art img{width:100%;display:block;aspect-ratio:1/1;object-fit:contain}
.art-cap{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.1em;color:var(--ink3);border-top:1px solid var(--line2);margin-top:18px;padding-top:14px}
.art-cap b{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:.08em}
.seal{position:absolute;top:38px;right:38px;width:52px;height:52px;background:var(--red);color:#FBF6EC;display:grid;place-items:center;font-family:var(--serif);font-size:23px;letter-spacing:0;box-shadow:0 2px 10px -4px rgba(158,59,44,.6);opacity:.92}

/* ---------- facets ---------- */
.facets{margin-top:8px}
.facet{display:grid;grid-template-columns:82px 1fr;gap:18px;align-items:start;padding:17px 0;border-bottom:1px solid var(--line2)}
.facet .k{font-family:var(--serif);font-size:15px;letter-spacing:.24em;color:var(--ink2);padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:5px 15px;border:1px solid var(--line);background:none;cursor:pointer;font-size:12.5px;color:var(--ink2);letter-spacing:.05em;transition:.25s}
.chip:hover{border-color:var(--ink);color:var(--ink);background:var(--card)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper2)}

/* ---------- cards ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 26px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.card .ph{background:var(--card);border:1px solid var(--line2);aspect-ratio:1/1;padding:8%;display:grid;place-items:center;overflow:hidden;transition:.45s cubic-bezier(.2,.7,.2,1)}
.card .ph img{width:100%;height:100%;object-fit:contain;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph{border-color:#B9AF99;box-shadow:0 16px 34px -26px rgba(27,30,27,.5);transform:translateY(-2px)}
.card:hover .ph img{transform:scale(1.05)}
.card .meta{padding-top:13px;border-top:1px solid transparent}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.16em;color:var(--ink3)}
.card h4{font-family:var(--serif);font-size:15.5px;font-weight:500;letter-spacing:.05em;margin-top:8px;color:var(--ink)}
.card .sub{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;margin-top:5px}
.card .tagline{display:inline-block;margin-top:9px;font-size:10px;letter-spacing:.14em;color:var(--jade);border-bottom:1px solid rgba(91,110,97,.3);padding-bottom:1px}

/* ---------- posters ---------- */
.posters{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.poster{position:relative;background:var(--card);border:1px solid var(--line2);cursor:pointer;overflow:hidden;padding:0;text-align:left;width:100%}
.poster img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.poster:hover img{transform:scale(1.035)}
.poster .dyn{position:absolute;left:18px;top:12px;font-family:var(--serif);font-size:clamp(28px,3.1vw,44px);line-height:1;color:var(--ink);letter-spacing:.08em;mix-blend-mode:multiply}
.poster .pm{padding:12px 15px 14px;border-top:1px solid var(--line2)}
.poster .pm b{display:block;font-family:var(--serif);font-size:13.5px;font-weight:500;letter-spacing:.06em}
.poster .pm span{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.1em;margin-top:3px}

/* ---------- topics ---------- */
.topics{display:grid;grid-template-columns:1.36fr 1fr 1fr;gap:20px}
.topic{position:relative;border:1px solid var(--line2);overflow:hidden;cursor:pointer;background:var(--card);aspect-ratio:1.55/1;display:block;padding:0;text-align:left;width:100%}
.topic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92;transition:transform .8s}
.topic:hover img{transform:scale(1.04)}
.topic .ov{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:space-between;
background:linear-gradient(175deg,rgba(251,248,240,.94) 0%,rgba(251,248,240,.62) 42%,rgba(246,242,232,.9) 100%)}
.topic .ov .t{font-family:var(--serif);font-size:20px;letter-spacing:.1em;line-height:1.4}
.topic .ov .d{font-size:11px;letter-spacing:.1em;color:var(--ink2);margin-top:8px;max-width:20em;line-height:1.9}
.topic .ov .n{font-size:10px;letter-spacing:.2em;color:var(--ink3)}

/* ---------- library ---------- */
.page-head{padding:64px 0 34px;border-bottom:1px solid var(--line)}
.page-head .eyebrow{margin-bottom:18px}
.page-head h2{font-family:var(--serif);font-size:clamp(30px,3.4vw,46px);font-weight:400;letter-spacing:.08em}
.page-head .desc{margin-top:16px;font-size:13.5px;color:var(--ink2);font-weight:300;max-width:44em;line-height:2}
.libbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0 6px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.types{display:flex;gap:8px}
.libsearch{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 14px;background:var(--card);min-width:300px}
.libsearch svg{width:14px;height:14px;opacity:.5;flex:none}
.libsearch input{border:0;background:none;outline:none;width:100%;font-size:13px}
.sorts{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);letter-spacing:.08em}
.sorts select{border:0;border-bottom:1px solid var(--line);background:none;padding:3px 2px;outline:none;font-size:12.5px;color:var(--ink2)}
.resbar{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0 18px;font-size:11.5px;letter-spacing:.14em;color:var(--ink3)}
.resbar b{font-family:var(--serif);font-size:17px;color:var(--ink);letter-spacing:.06em;font-weight:500}
.activef{display:flex;gap:8px;flex-wrap:wrap}
.af{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;color:var(--ink2);border:1px solid var(--line);padding:3px 10px;cursor:pointer;background:var(--card)}
.af:hover{border-color:var(--red);color:var(--red)}
.loadmore{display:flex;justify-content:center;padding:56px 0 10px}
.empty{padding:80px 0;text-align:center;color:var(--ink3);font-size:13px;letter-spacing:.1em}

/* ---------- detail ---------- */
.crumb{font-size:11.5px;letter-spacing:.1em;color:var(--ink3);padding:26px 0 0}
.crumb a:hover{color:var(--red)}
.detail{display:grid;grid-template-columns:1.22fr .78fr;gap:64px;padding:30px 0 0;align-items:start}
.viewer{background:var(--card);border:1px solid var(--line);padding:44px;position:relative;overflow:hidden}
.viewer img{width:100%;display:block;aspect-ratio:1/1;object-fit:contain}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wm span{position:absolute;font-size:12.5px;color:rgba(158,59,44,.17);letter-spacing:.24em;white-space:nowrap;transform:rotate(-30deg)}
.viewer .vno{position:absolute;left:16px;top:14px;font-size:10px;letter-spacing:.18em;color:var(--ink3)}
.info h2{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.07em;line-height:1.45}
.info .sub{margin-top:10px;font-size:12.5px;letter-spacing:.12em;color:var(--ink3)}
.spec{border-top:1px solid var(--line);margin-top:26px}
.spec .row{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.spec .k{color:var(--ink3);letter-spacing:.14em}
.spec .v{color:var(--ink2);letter-spacing:.04em}
.acts{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.acts .btn{justify-content:center;width:100%}
.note{margin-top:16px;font-size:11.5px;line-height:1.95;color:var(--ink3)}
.rel{margin-top:88px}
.rel h3{font-family:var(--serif);font-size:19px;letter-spacing:.12em;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:28px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:150;display:none;place-items:center;padding:24px;background:rgba(24,26,24,.45);backdrop-filter:blur(3px)}
.modal.on{display:grid}
.dlg{background:var(--paper2);border:1px solid var(--line);width:min(480px,100%);padding:40px 38px 34px;position:relative}
.dlg .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1;padding:8px}
.dlg h3{font-family:var(--serif);font-size:21px;letter-spacing:.1em;font-weight:500}
.dlg p{font-size:12px;color:var(--ink2);line-height:1.95;margin-top:12px;font-weight:300}
.dlg label{display:block;font-size:11px;letter-spacing:.14em;color:var(--ink3);margin:26px 0 8px}
.dlg input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 0;outline:none;font-size:14px;letter-spacing:.04em}
.dlg input:focus{border-color:var(--ink)}
.dlg .err{color:var(--red);font-size:11.5px;margin-top:10px;min-height:16px;letter-spacing:.04em}
.dlg .ck{display:flex;align-items:flex-start;gap:9px;margin-top:20px;font-size:11.5px;color:var(--ink2);line-height:1.7}
.dlg .ck input{width:13px;height:13px;margin-top:4px;flex:none}
.dlg .btn{width:100%;justify-content:center;margin-top:24px}

/* ---------- about / footer ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding-top:10px}
.about-grid p{font-size:14px;font-weight:300;line-height:2.15;color:var(--ink2);margin-bottom:18px}
.about-grid h4{font-family:var(--serif);font-size:17px;letter-spacing:.1em;font-weight:500;margin:0 0 14px}
.books{border-top:1px solid var(--line);margin-top:56px}
.book{display:grid;grid-template-columns:200px 1fr;gap:30px;padding:24px 0;border-bottom:1px solid var(--line2)}
.book .bn{font-family:var(--serif);font-size:16px;letter-spacing:.06em;line-height:1.6}
.book .bn small{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.1em;margin-top:6px;font-family:var(--sans)}
.book .bd{font-size:12.5px;color:var(--ink2);line-height:2;font-weight:300}

.footer{margin-top:110px;border-top:1px solid var(--line);background:rgba(251,248,240,.6)}
.footer-in{max-width:var(--maxw);margin:0 auto;padding:56px 40px 30px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.footer .fb h5{font-family:var(--serif);font-size:21px;letter-spacing:.24em;font-weight:500}
.footer .fb p{font-size:11.5px;color:var(--ink3);line-height:2;margin-top:14px;max-width:22em;letter-spacing:.04em}
.footer .col h6{font-size:11px;letter-spacing:.2em;color:var(--ink3);margin-bottom:16px}
.footer .col a,.footer .col span{display:block;font-size:12px;color:var(--ink2);padding:4px 0;cursor:pointer;letter-spacing:.04em}
.footer .col a:hover{color:var(--red)}
.copy{max-width:var(--maxw);margin:0 auto;padding:20px 40px 44px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.08em;color:var(--ink3)}

/* ---------- responsive ---------- */
@media(max-width:1120px){
.hero{grid-template-columns:1fr;gap:48px;padding:64px 0 60px}
.grid4{grid-template-columns:repeat(3,1fr)}
.posters{grid-template-columns:repeat(3,1fr)}
.topics{grid-template-columns:1fr 1fr}
.detail{grid-template-columns:1fr;gap:40px}
.viewer{padding:26px}
.about-grid{grid-template-columns:1fr;gap:32px}
.footer-in{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
.nav-in{padding:0 20px;height:64px;gap:16px}
.brand small{display:none}
.nav-links{gap:16px;font-size:12px}
.search{display:none}
.wrap{padding:0 20px}
.grid4{grid-template-columns:repeat(2,1fr);gap:20px 16px}
.posters{grid-template-columns:repeat(2,1fr)}
.topics{grid-template-columns:1fr}
.facet{grid-template-columns:1fr;gap:8px}
.hero h2{font-size:32px}
.dlg{padding:30px 22px}
.book{grid-template-columns:1fr;gap:10px}
}
/* ---------- 专题 · 器物索引 ---------- */
.reflist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 56px;
  font-size:13px;line-height:1.95;color:var(--ink2);font-weight:300}
.reflist li{padding-left:16px;position:relative}
.reflist li::before{content:"";position:absolute;left:0;top:12px;width:6px;height:1px;background:var(--red);opacity:.7}
.reflist b{font-family:var(--serif);font-weight:400;color:var(--ink);letter-spacing:.1em}


</style>
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <div class="brand" data-go="#/">
      <h1>纹明</h1><small>PATTERN ARCHIVE</small>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="7"/><path d="M15.8 15.8L21 21"/></svg>
      <input id="navq" type="text" placeholder="搜索纹样、载体、时代">
    </div>
    <nav class="nav-links">
      <a href="#/library" data-nav="library">图案资源库</a>
      <a href="#/topic/jigangbei" data-nav="topic">专题</a>
      <a href="#/about" data-nav="about">关于</a>
    </nav>
  </div>
</header>

<main id="app"></main>

function filterItems(q){
  let list = DB.items.slice();
  const keyMap = {d:"d", r:"r", c:"c", v:"v", g:"g", t:"t"};
  ["d","r","c","v","g","t"].forEach(k=>{ if(q[k]) list = list.filter(x=>x[keyMap[k]]===q[k]); });
  if(q.f){
    const fams = {geometry:["huiwen","lattice","wanzi","scale","diaper","coin"],
                  scroll:["scroll","baoxiang"], rosette:["medi","lianzhu","rosette"]};
    const f = fams[q.f] || (q.f.startsWith("chicken") ? ["chicken"] : []);
    if(f.length) list = list.filter(x=>f.includes(x.f));
  }
  if(q.q){
    const s = q.q.trim().toLowerCase();
    if(s) list = list.filter(x => (x.n+x.d+x.r+x.c+x.v+x.g+x.id).toLowerCase().includes(s));
  }
  if(q.sort==="no") list.sort((a,b)=>a.id.localeCompare(b.id));
  else if(q.sort==="d") list.sort((a,b)=>a.d.localeCompare(b.d) || a.id.localeCompare(b.id));
  else list.sort((a,b)=>b.a-a.a || b.id.localeCompare(a.id));
  return list;
}

let libState = {q:{}, list:[], shown:0};

  const {q, list} = libState;
  if(!append) libState.shown = 0;
  const start = libState.shown;
  const slice = list.slice(0, start + PAGE);

  const grid = $("#res");
  if(!grid) return;
  if(!list.length){
    grid.innerHTML = "";
    $("#lm").innerHTML = `<div class="empty">没有匹配的素材，试试去掉一两个筛选条件。</div>`;
  } else {
    grid.insertAdjacentHTML("beforeend", slice.slice(start).map(cardHTML).join(""));
    $("#lm").innerHTML = libState.shown < list.length
      ? `<button class="btn" id="lmbtn">加载更多（已显示 ${libState.shown} / ${list.length}）</button>`
      : `<div class="empty">已显示全部 ${list.length} 组</div>`;
    const b = $("#lmbtn"); if(b) b.onclick = ()=>renderResults(true);
  }
  const active = Object.entries(q).filter(([k,v])=>["d","r","c","v","g","t"].includes(k)&&v);

/* ---------- 关于 ---------- */
function viewAbout(){

        <h4>双向授权</h4>

/* ---------- 路由 ---------- */
function parseHash(){
  const raw = location.hash.slice(1) || "/";
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = {};
  new URLSearchParams(qs || "").forEach((v,k)=>q[k]=v);
  return {parts, q};
}
function render(){
  const {parts, q} = parseHash();
  const app = $("#app");
  let html, navKey = "";
  if(!parts.length || parts[0]===""){ html = viewHome(); navKey=""; }
  else if(parts[0]==="library"){ html = viewLibrary(q); navKey="library"; libState.q=q; libState.list=filterItems(q); }
  else if(parts[0]==="item"){ html = viewItem(parts[1]); navKey="library"; }
  else if(parts[0]==="topic"){ html = viewTopic(parts[1]); navKey="topic"; }
  else if(parts[0]==="about"){ html = viewAbout(); navKey="about"; }
  else { html = viewHome(); }
  app.innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on", a.dataset.nav===navKey));
  document.querySelectorAll("[data-fk]").forEach(b=>{
    const v = b.dataset.fv;
    const on = v ? (q[b.dataset.fk] === v) : (!q[b.dataset.fk]);
    if(b.dataset.empty === "1" || q[b.dataset.fk] !== undefined) b.classList.toggle("on", on);
  });
  window.scrollTo({top:0,behavior:"instant"});
  if(parts[0]==="library" || !parts.length){ 
    if($("#res")) renderResults(false);
    if($("#libq")) bindLibSearch();
  }
}
function bindLibSearch(){
  const inp = $("#libq");
  let timer;
  inp.addEventListener("input", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      libState.q.q = inp.value;
      libState.list = filterItems(libState.q);
      renderResults(false);
    }, 220);
  });
  const sel = $("#sortsel");
  sel.addEventListener("change", ()=>{
    libState.q.sort = sel.value;
    libState.list = filterItems(libState.q);
    renderResults(false);
  });
}

/* ---------- 交互 ---------- */
document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if(go){ e.preventDefault(); location.hash = go.dataset.go; return; }

  const fk = e.target.closest("[data-fk]");
  if(fk){
    const cur = parseHash().q;
    const nq = {...cur};
    const k = fk.dataset.fk, v = fk.dataset.fv;
    if(!v || nq[k] === v) delete nq[k]; else nq[k] = v;
    const qs = Object.entries(nq).map(([a,b])=>`${a}=${encodeURIComponent(b)}`).join("&");
    location.hash = "#/library" + (qs ? "?"+qs : "");
    return;
  }

  const un = e.target.closest("[data-unset]");
  if(un){
    const k = un.dataset.unset;
    const {q} = parseHash();
    const nq = {...q};
    delete nq[k];
    const qs = Object.entries(nq).map(([a,b])=>`${a}=${encodeURIComponent(b)}`).join("&");
    location.hash = "#/library" + (qs?"?"+qs:"");
    return;
  }
  const mail = e.target.closest("[data-mail]");
  if(mail){ openMail(); return; }

  const dl = e.target.closest("[data-dl]");
  if(dl){
    const a = document.createElement("a");
    const ext = (dl.dataset.dl.split(".").pop() || "jpg").toLowerCase();
    a.href = dl.dataset.dl; a.download = (dl.dataset.name||"纹明素材") + "." + ext;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  const closer = e.target.closest("[data-close]");
  if(closer) closeModal();
});
document.addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target && e.target.id === "navq"){
    location.hash = "#/library?q=" + encodeURIComponent(e.target.value);
  }
});

function openMail(){
  const got = localStorage.getItem("wm_email");
  $("#dlg").innerHTML = `<button class="x" data-close aria-label="关闭">×</button>
    <h3>登记取图</h3>
    <p>登记邮箱后即可下载高清矢量与朝代主视觉。我们只用它确认用途并回传授权范围，不发营销邮件。</p>
    <label>邮箱</label>
    <input id="mailin" type="email" placeholder="you@studio.com" value="${esc(got||"")}">
    <div class="err" id="mailerr"></div>
    <div class="ck"><input type="checkbox" id="mailck"><span>我同意仅将素材用于研究、设计与文创开发，不二次转授。</span></div>
    <button class="btn solid" id="mailsub">登记并解锁下载</button>`;
  $("#modal").classList.add("on");
  $("#mailsub").onclick = ()=>{
    const v = $("#mailin").value.trim();
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    if(!ok){ $("#mailerr").textContent = "请填写有效邮箱地址"; return; }
    if(!$("#mailck").checked){ $("#mailerr").textContent = "请先勾选使用边界"; return; }
    localStorage.setItem("wm_email", v);
    closeModal();
    const it = $("#acts"); if(it) it.innerHTML = actsHTML(byId(parseHash().parts[1]) || {t:""});
    toast("已登记 " + v + "，下载已解锁（演示环境不发送邮件）");
  };
}
function closeModal(){ $("#modal").classList.remove("on"); }
function toast(msg){
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:#1B1E1B;color:#F6F2E8;padding:12px 22px;font-size:12px;letter-spacing:.08em;z-index:200;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3200);
}

window.addEventListener("hashchange", render);
render();
</script>
